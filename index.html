<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MediaPipe Snake 🐍</title>

    <!-- MediaPipe -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #10131a;
            color: white;
            font-family: Arial, sans-serif;

            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            margin: 20px 0 5px;
            font-size: 32px;
        }

        #score {
            font-size: 20px;
            margin-bottom: 15px;
        }

        .game-container {
            position: relative;
        }

        #gameCanvas {
            background: #181d27;
            border: 3px solid #444;
            border-radius: 12px;
            display: block;
        }

        .camera-container {
            position: absolute;
            right: 15px;
            top: 15px;
            width: 180px;
            height: 135px;
            border: 2px solid white;
            border-radius: 10px;
            overflow: hidden;
            background: black;
        }

        #video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
        }

        #handCanvas {
            position: absolute;
            width: 100%;
            height: 100%;
            left: 0;
            top: 0;
            transform: scaleX(-1);
        }

        #message {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);

            background: rgba(0, 0, 0, 0.85);
            padding: 25px 40px;
            border-radius: 15px;

            text-align: center;
            display: none;
        }

        #message h2 {
            margin-top: 0;
        }

        button {
            border: none;
            border-radius: 8px;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }

        .instructions {
            margin-top: 15px;
            text-align: center;
            color: #bbb;
            max-width: 650px;
        }

        .status {
            margin-top: 8px;
            color: #7ee787;
        }
    </style>
</head>

<body>

    <h1>🐍 MediaPipe Snake</h1>

    <div id="score">
        Score: <span id="scoreValue">0</span>
    </div>

    <div class="game-container">

        <canvas id="gameCanvas"
                width="700"
                height="500">
        </canvas>

        <!-- Webcam -->
        <div class="camera-container">
            <video id="video" autoplay playsinline></video>
            <canvas id="handCanvas"></canvas>
        </div>

        <!-- Game Over -->
        <div id="message">
            <h2>💥 Game Over!</h2>
            <p>Your score: <span id="finalScore">0</span></p>
            <button onclick="restartGame()">Restart 🐍</button>
        </div>

    </div>

    <div class="instructions">
        ☝️ Point your index finger to control the snake.
        <br>
        Up = ↑ &nbsp;&nbsp; Down = ↓ &nbsp;&nbsp;
        Left = ← &nbsp;&nbsp; Right = →
    </div>

    <div class="status" id="status">
        Starting camera...
    </div>


<script>

    // =========================================================
    // CANVAS
    // =========================================================

    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    const video = document.getElementById("video");

    const handCanvas = document.getElementById("handCanvas");
    const handCtx = handCanvas.getContext("2d");

    const scoreElement = document.getElementById("scoreValue");
    const statusElement = document.getElementById("status");

    const GRID_SIZE = 25;

    const COLS = canvas.width / GRID_SIZE;
    const ROWS = canvas.height / GRID_SIZE;


    // =========================================================
    // SNAKE
    // =========================================================

    let snake = [
        { x: 10, y: 10 },
        { x: 9, y: 10 },
        { x: 8, y: 10 }
    ];

    let direction = {
        x: 1,
        y: 0
    };

    let nextDirection = {
        x: 1,
        y: 0
    };


    // =========================================================
    // COIN
    // =========================================================

    let coin = {
        x: 20,
        y: 10
    };


    // =========================================================
    // GAME VARIABLES
    // =========================================================

    let score = 0;
    let gameOver = false;

    const GAME_SPEED = 130;


    // =========================================================
    // RANDOM COIN
    // =========================================================

    function generateCoin() {

        let newCoin;

        do {

            newCoin = {
                x: Math.floor(Math.random() * COLS),
                y: Math.floor(Math.random() * ROWS)
            };

        } while (
            snake.some(segment =>
                segment.x === newCoin.x &&
                segment.y === newCoin.y
            )
        );

        coin = newCoin;
    }


    // =========================================================
    // DRAW GAME
    // =========================================================

    function drawGame() {

        // Background
        ctx.fillStyle = "#181d27";
        ctx.fillRect(
            0,
            0,
            canvas.width,
            canvas.height
        );


        // Grid
        ctx.strokeStyle = "#222936";
        ctx.lineWidth = 1;

        for (let x = 0; x <= canvas.width; x += GRID_SIZE) {

            ctx.beginPath();
            ctx.moveTo(x, 0);
            ctx.lineTo(x, canvas.height);
            ctx.stroke();
        }

        for (let y = 0; y <= canvas.height; y += GRID_SIZE) {

            ctx.beginPath();
            ctx.moveTo(0, y);
            ctx.lineTo(canvas.width, y);
            ctx.stroke();
        }


        // =====================================================
        // COIN
        // =====================================================

        const coinX =
            coin.x * GRID_SIZE + GRID_SIZE / 2;

        const coinY =
            coin.y * GRID_SIZE + GRID_SIZE / 2;

        ctx.beginPath();

        ctx.arc(
            coinX,
            coinY,
            GRID_SIZE * 0.35,
            0,
            Math.PI * 2
        );

        ctx.fillStyle = "#FFD700";
        ctx.fill();

        ctx.strokeStyle = "#FFF2A6";
        ctx.lineWidth = 2;
        ctx.stroke();


        // =====================================================
        // SNAKE
        // =====================================================

        snake.forEach((segment, index) => {

            ctx.fillStyle =
                index === 0
                    ? "#55ff88"
                    : "#27c95f";

            ctx.fillRect(
                segment.x * GRID_SIZE + 2,
                segment.y * GRID_SIZE + 2,
                GRID_SIZE - 4,
                GRID_SIZE - 4
            );

        });


        // Snake eyes
        const head = snake[0];

        ctx.fillStyle = "black";

        let eye1;
        let eye2;

        if (direction.x === 1) {

            eye1 = {
                x: head.x * GRID_SIZE + 17,
                y: head.y * GRID_SIZE + 7
            };

            eye2 = {
                x: head.x * GRID_SIZE + 17,
                y: head.y * GRID_SIZE + 17
            };

        } else if (direction.x === -1) {

            eye1 = {
                x: head.x * GRID_SIZE + 7,
                y: head.y * GRID_SIZE + 7
            };

            eye2 = {
                x: head.x * GRID_SIZE + 7,
                y: head.y * GRID_SIZE + 17
            };

        } else if (direction.y === -1) {

            eye1 = {
                x: head.x * GRID_SIZE + 7,
                y: head.y * GRID_SIZE + 7
            };

            eye2 = {
                x: head.x * GRID_SIZE + 17,
                y: head.y * GRID_SIZE + 7
            };

        } else {

            eye1 = {
                x: head.x * GRID_SIZE + 7,
                y: head.y * GRID_SIZE + 17
            };

            eye2 = {
                x: head.x * GRID_SIZE + 17,
                y: head.y * GRID_SIZE + 17
            };
        }

        ctx.beginPath();
        ctx.arc(eye1.x, eye1.y, 2, 0, Math.PI * 2);
        ctx.fill();

        ctx.beginPath();
        ctx.arc(eye2.x, eye2.y, 2, 0, Math.PI * 2);
        ctx.fill();
    }


    // =========================================================
    // GAME UPDATE
    // =========================================================

    function updateGame() {

        if (gameOver) return;


        // Apply requested direction
        direction = nextDirection;


        const head = snake[0];

        const newHead = {
            x: head.x + direction.x,
            y: head.y + direction.y
        };


        // =====================================================
        // WALL COLLISION
        // =====================================================

        if (
            newHead.x < 0 ||
            newHead.x >= COLS ||
            newHead.y < 0 ||
            newHead.y >= ROWS
        ) {

            endGame();
            return;
        }


        // =====================================================
        // SELF COLLISION
        // =====================================================

        if (
            snake.some(segment =>
                segment.x === newHead.x &&
                segment.y === newHead.y
            )
        ) {

            endGame();
            return;
        }


        // Add new head
        snake.unshift(newHead);


        // =====================================================
        // COIN COLLISION
        // =====================================================

        if (
            newHead.x === coin.x &&
            newHead.y === coin.y
        ) {

            score++;

            scoreElement.textContent = score;

            generateCoin();

        } else {

            // Remove tail
            snake.pop();
        }


        drawGame();
    }


    // =========================================================
    // GAME OVER
    // =========================================================

    function endGame() {

        gameOver = true;

        document.getElementById("finalScore")
            .textContent = score;

        document.getElementById("message")
            .style.display = "block";
    }


    // =========================================================
    // RESTART
    // =========================================================

    function restartGame() {

        snake = [
            { x: 10, y: 10 },
            { x: 9, y: 10 },
            { x: 8, y: 10 }
        ];

        direction = {
            x: 1,
            y: 0
        };

        nextDirection = {
            x: 1,
            y: 0
        };

        score = 0;

        scoreElement.textContent = "0";

        gameOver = false;

        generateCoin();

        document.getElementById("message")
            .style.display = "none";

        drawGame();
    }


    // =========================================================
    // CHANGE DIRECTION
    // =========================================================

    function changeDirection(newDirection) {

        // Prevent 180-degree turns

        if (
            newDirection.x === -direction.x &&
            newDirection.y === -direction.y
        ) {
            return;
        }

        nextDirection = newDirection;
    }


    // =========================================================
    // KEYBOARD CONTROLS
    // =========================================================

    document.addEventListener("keydown", event => {

        if (event.key === "ArrowUp") {

            changeDirection({
                x: 0,
                y: -1
            });

        } else if (event.key === "ArrowDown") {

            changeDirection({
                x: 0,
                y: 1
            });

        } else if (event.key === "ArrowLeft") {

            changeDirection({
                x: -1,
                y: 0
            });

        } else if (event.key === "ArrowRight") {

            changeDirection({
                x: 1,
                y: 0
            });

        }

    });


    // =========================================================
    // MEDIAPIPE HANDS
    // =========================================================

    const hands = new Hands({
        locateFile: (file) => {

            return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;

        }
    });


    hands.setOptions({

        maxNumHands: 1,

        modelComplexity: 1,

        minDetectionConfidence: 0.6,

        minTrackingConfidence: 0.6

    });


    // =========================================================
    // HAND DETECTION RESULT
    // =========================================================

    hands.onResults(results => {

        // Clear hand canvas

        handCtx.clearRect(
            0,
            0,
            handCanvas.width,
            handCanvas.height
        );


        if (
            results.multiHandLandmarks &&
            results.multiHandLandmarks.length > 0
        ) {

            const landmarks =
                results.multiHandLandmarks[0];


            // Draw hand skeleton

            drawConnectors(
                handCtx,
                landmarks,
                HAND_CONNECTIONS,
                {
                    color: "#00FF00",
                    lineWidth: 2
                }
            );

            drawLandmarks(
                handCtx,
                landmarks,
                {
                    color: "#FF0000",
                    lineWidth: 1
                }
            );


            // =================================================
            // INDEX FINGER
            // =================================================

            // Landmark 8 = index fingertip
            // Landmark 5 = index finger base

            const tip = landmarks[8];

            const base = landmarks[5];


            // Difference

            const dx = tip.x - base.x;
            const dy = tip.y - base.y;


            // We only change direction when
            // the finger is pointing strongly enough.

            const threshold = 0.08;


            if (
                Math.abs(dx) > Math.abs(dy)
            ) {

                if (Math.abs(dx) > threshold) {

                    if (dx > 0) {

                        // Right

                        changeDirection({
                            x: -1,
                            y: 0
                        });

                        statusElement.textContent =
                            "☝️ Hand detected — LEFT";

                    } else {

                        // Left

                        changeDirection({
                            x: 1,
                            y: 0
                        });

                        statusElement.textContent =
                            "☝️ Hand detected — RIGHT";
                    }
                }

            } else {

                if (Math.abs(dy) > threshold) {

                    if (dy > 0) {

                        // Down

                        changeDirection({
                            x: 0,
                            y: 1
                        });

                        statusElement.textContent =
                            "☝️ Hand detected — DOWN";

                    } else {

                        // Up

                        changeDirection({
                            x: 0,
                            y: -1
                        });

                        statusElement.textContent =
                            "☝️ Hand detected — UP";
                    }
                }
            }

        } else {

            statusElement.textContent =
                "✋ Show your hand to the camera";
        }

    });


    // =========================================================
    // CAMERA
    // =========================================================

    const camera = new Camera(video, {

        onFrame: async () => {

            await hands.send({
                image: video
            });

        },

        width: 640,
        height: 480

    });


    // =========================================================
    // START EVERYTHING
    // =========================================================

    async function startCamera() {

        try {

            await camera.start();

            statusElement.textContent =
                "📷 Camera active — show your hand!";

        } catch (error) {

            console.error(error);

            statusElement.textContent =
                "❌ Camera permission required";
        }

    }


    // =========================================================
    // INITIALIZE GAME
    // =========================================================

    generateCoin();

    drawGame();

    setInterval(updateGame, GAME_SPEED);

    startCamera();

</script>

</body>
</html>
